services:
  db:
    image: postgres:17-alpine
    container_name: gjtech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gjtech
      POSTGRES_PASSWORD: gjtdev
      POSTGRES_DB: gjtech_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - gjtech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gjtech -d gjtech_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gjtech_pgdata:
